<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>读取剪贴板</title></head>
<body>
<h1>读取剪贴板</h1>
<p>点下面按钮，页面会用 navigator.clipboard.readText() 读取剪贴板并显示在框里。不提交、不上传。</p>
<button id="readBtn" type="button">读取剪贴板</button>
<br><br>
<textarea id="box" rows="4" cols="80" readonly placeholder="读取结果会显示在这里"></textarea>
<pre id="out"></pre>
<script>
document.getElementById('readBtn').addEventListener('click', async () => {
  const out = document.getElementById('out');
  const box = document.getElementById('box');
  try {
    const t = await navigator.clipboard.readText();
    box.value = t;
    out.textContent = '读取成功：' + t;
  } catch (e) {
    out.textContent = '读取失败：' + e.name + ' ' + e.message;
  }
});
</script>
</body>
</html>
